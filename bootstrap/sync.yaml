apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elektrokube-deploy
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./clusters/elektrokube
  sourceRef:
    kind: GitRepository
    name: elektrokube-deploy
  prune: false
  deletionPolicy: Orphan
  wait: false
