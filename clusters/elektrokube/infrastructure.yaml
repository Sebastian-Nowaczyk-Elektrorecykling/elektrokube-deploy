apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deploy-flux-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  path: ./infrastructure/flux-operator
  sourceRef: {kind: GitRepository, name: elektrokube-deploy}
  prune: false
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deploy-gateway
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  path: ./infrastructure/gateway
  sourceRef: {kind: GitRepository, name: elektrokube-deploy}
  prune: false
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: cilium
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deploy-applications
  namespace: flux-system
spec:
  interval: 1m
  timeout: 10m
  path: ./applications
  sourceRef: {kind: GitRepository, name: elektrokube-deploy}
  prune: true
  deletionPolicy: Orphan
  wait: false
  dependsOn:
    - name: deploy-flux-operator
    - name: deploy-gateway
    - name: storage-cnpg
    - name: storage-classes
    - name: storage-cnpg-policy
